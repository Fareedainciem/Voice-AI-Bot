<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #581c87 50%, #0f172a 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding-top: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #cbd5e1;
            font-size: 1.1rem;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .language-bar {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 30px;
        }

        .dropdown {
            position: relative;
            width: 100%;
        }

        .dropdown-button {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .dropdown-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .dropdown-item.active {
            background: rgba(168, 85, 247, 0.3);
            color: #c084fc;
        }

        .recording-area {
            padding: 50px;
            text-align: center;
        }

        .record-button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(168, 85, 247, 0.3);
            margin-bottom: 30px;
        }

        .record-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 50px rgba(168, 85, 247, 0.5);
        }

        .record-button.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .record-button svg {
            width: 60px;
            height: 60px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #94a3b8;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .divider span {
            padding: 0 20px;
            font-size: 0.9rem;
        }

        .upload-button {
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .upload-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .audio-preview {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }

        .audio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .audio-header span {
            color: #c084fc;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .clear-button {
            background: transparent;
            border: none;
            color: #f87171;
            cursor: pointer;
            padding: 5px;
        }

        .clear-button:hover {
            color: #ef4444;
        }

        audio {
            width: 100%;
            height: 40px;
        }

        .send-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3);
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.4);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 30px;
            color: #fca5a5;
        }

        .response-area {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            max-height: 600px;
            overflow-y: auto;
        }

        .message {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.2rem;
        }

        .user-avatar {
            background: rgba(59, 130, 246, 0.3);
        }

        .bot-avatar {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
        }

        .message-content {
            flex: 1;
        }

        .message-label {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .message-text {
            color: white;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .play-button {
            padding: 10px 20px;
            background: rgba(168, 85, 247, 0.3);
            border: none;
            border-radius: 10px;
            color: #c084fc;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .play-button:hover {
            background: rgba(168, 85, 247, 0.4);
        }

        .hidden {
            display: none;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 1.1rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Voice AI Bot</h1>
            <p>Speak in any language, get instant responses</p>
        </div>

        <div class="main-card">
            <!-- Language Selector -->
            <div class="language-bar">
                <div class="dropdown">
                    <button class="dropdown-button" id="languageButton">
                        <span id="selectedLanguage">English</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="dropdown-menu" id="languageMenu">
                        <div class="dropdown-item active" data-value="en" data-name="English">English</div>
                        <div class="dropdown-item" data-value="ml" data-name="Malayalam (മലയാളം)">Malayalam (മലയാളം)</div>
                        <div class="dropdown-item" data-value="hi" data-name="Hindi (हिंदी)">Hindi (हिंदी)</div>
                        <div class="dropdown-item" data-value="ta" data-name="Tamil (தமிழ்)">Tamil (தமிழ்)</div>
                        <div class="dropdown-item" data-value="ar" data-name="Arabic">Arabic</div>
                        <div class="dropdown-item" data-value="fr" data-name="French">French</div>
                        <div class="dropdown-item" data-value="es" data-name="Spanish">Spanish</div>
                    </div>
                </div>
            </div>

            <!-- Recording Area -->
            <div class="recording-area" id="recordingArea">
                <button class="record-button" id="recordButton">
                    <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                <p class="status-text" id="statusText">Click microphone to start recording</p>

                <div class="divider">
                    <span>or</span>
                </div>

                <button class="upload-button" id="uploadButton">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    Upload Audio File
                </button>
                <input type="file" id="fileInput" accept="audio/*" class="hidden">
            </div>

            <!-- Audio Preview Area -->
            <div id="audioPreviewArea" class="hidden" style="padding: 0 50px 50px;">
                <div class="audio-preview">
                    <div class="audio-header">
                        <span>Your Recording</span>
                        <button class="clear-button" id="clearButton">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <audio id="audioPreview" controls></audio>
                </div>
                <button class="send-button" id="sendButton">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    <span id="sendButtonText">Send to AI</span>
                </button>
            </div>

            <!-- Error Area -->
            <div id="errorArea" class="error-box hidden"></div>

            <!-- Response Area (Chat History) -->
            <div id="responseArea" class="response-area hidden">
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;
        let selectedLang = 'en';
        let isRecording = false;
        let sessionId = null;

        // Initialize session
        async function initSession() {
            try {
                // Check if session exists in localStorage
                sessionId = localStorage.getItem('voicebotSessionId');
                if (!sessionId) {
                    // Create new session
                    const response = await fetch('http://127.0.0.1:8000/new-session', {
                        method: 'POST'
                    });
                    const data = await response.json();
                    sessionId = data.session_id;
                    localStorage.setItem('voicebotSessionId', sessionId);
                    console.log('New session created:', sessionId);
                } else {
                    console.log('Resuming session:', sessionId);
                    // Load previous history
                    loadChatHistory();
                }
            } catch (err) {
                console.error('Session error:', err);
            }
        }

        async function loadChatHistory() {
            try {
                const response = await fetch(`http://127.0.0.1:8000/history/${sessionId}`);
                const data = await response.json();
                
                if (data.history && data.history.length > 0) {
                    // Display loaded history
                    const responseArea = document.getElementById('responseArea');
                    data.history.forEach(msg => {
                        displayHistoryMessage(msg);
                    });
                }
            } catch (err) {
                console.error('Error loading history:', err);
            }
        }

        function displayHistoryMessage(msg) {
            const responseArea = document.getElementById('responseArea');
            const userDiv = document.createElement('div');
            userDiv.className = 'message';
            userDiv.innerHTML = `
                <div class="message-avatar user-avatar">👤</div>
                <div class="message-content">
                    <div class="message-label">You said</div>
                    <div class="message-text">${escapeHtml(msg.user)}</div>
                </div>
            `;
            responseArea.appendChild(userDiv);

            const botDiv = document.createElement('div');
            botDiv.className = 'message';
            botDiv.innerHTML = `
                <div class="message-avatar bot-avatar">🤖</div>
                <div class="message-content">
                    <div class="message-label">AI Response</div>
                    <div class="message-text">${escapeHtml(msg.bot)}</div>
                </div>
            `;
            responseArea.appendChild(botDiv);
            responseArea.classList.remove('hidden');
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Dropdown
        const languageButton = document.getElementById('languageButton');
        const languageMenu = document.getElementById('languageMenu');
        const selectedLanguageSpan = document.getElementById('selectedLanguage');

        languageButton.addEventListener('click', () => {
            languageMenu.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!languageButton.contains(e.target) && !languageMenu.contains(e.target)) {
                languageMenu.classList.remove('show');
            }
        });

        document.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                selectedLang = item.dataset.value;
                selectedLanguageSpan.textContent = item.dataset.name;
                languageMenu.classList.remove('show');
            });
        });

        // Recording
        const recordButton = document.getElementById('recordButton');
        const statusText = document.getElementById('statusText');
        const audioPreviewArea = document.getElementById('audioPreviewArea');
        const audioPreview = document.getElementById('audioPreview');
        const recordingArea = document.getElementById('recordingArea');

        recordButton.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        audioPreview.src = URL.createObjectURL(audioBlob);
                        audioPreviewArea.classList.remove('hidden');
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordButton.classList.add('recording');
                    statusText.textContent = 'Recording... Click to stop';
                } catch (err) {
                    showError('Microphone access denied. Please allow microphone permissions.');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordButton.classList.remove('recording');
                statusText.textContent = 'Click microphone to start recording';
            }
        });

        // File Upload
        const uploadButton = document.getElementById('uploadButton');
        const fileInput = document.getElementById('fileInput');

        uploadButton.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                audioBlob = file;
                audioPreview.src = URL.createObjectURL(file);
                audioPreviewArea.classList.remove('hidden');
            }
        });

        // Clear
        document.getElementById('clearButton').addEventListener('click', () => {
            audioBlob = null;
            audioPreview.src = '';
            audioPreviewArea.classList.add('hidden');
            fileInput.value = '';
        });

        // Send
        const sendButton = document.getElementById('sendButton');
        const sendButtonText = document.getElementById('sendButtonText');

        sendButton.addEventListener('click', async () => {
            if (!audioBlob) return;

            sendButton.disabled = true;
            sendButtonText.innerHTML = '<div class="loader"></div> Processing...';
            hideError();

            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.wav');
            formData.append('language', selectedLang);
            formData.append('session_id', sessionId);

            try {
                const response = await fetch('http://127.0.0.1:8000/voice-chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                } else {
                    showResponse(data);
                    // Keep audio visible until user manually clears it
                }
            } catch (err) {
                showError('Failed to process audio. Make sure the backend is running on port 8000.');
            } finally {
                sendButton.disabled = false;
                sendButtonText.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg> Send to AI';
            }
        });

        function showResponse(data) {
            const userDiv = document.createElement('div');
            userDiv.className = 'message';
            userDiv.innerHTML = `
                <div class="message-avatar user-avatar">👤</div>
                <div class="message-content">
                    <div class="message-label">You said</div>
                    <div class="message-text">${escapeHtml(data.user_text)}</div>
                </div>
            `;
            
            const botDiv = document.createElement('div');
            botDiv.className = 'message';
            const audioId = `audio-${Date.now()}`;
            botDiv.innerHTML = `
                <div class="message-avatar bot-avatar">🤖</div>
                <div class="message-content">
                    <div class="message-label">AI Response</div>
                    <div class="message-text">${escapeHtml(data.bot_text)}</div>
                    <button class="play-button" onclick="playAudio('${audioId}')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="play-icon-${audioId}">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <span class="play-text-${audioId}">Play Audio</span>
                    </button>
                    <audio id="${audioId}" src="http://127.0.0.1:8000${data.audio_url}"></audio>
                </div>
            `;
            
            const responseArea = document.getElementById('responseArea');
            responseArea.appendChild(userDiv);
            responseArea.appendChild(botDiv);
            responseArea.classList.remove('hidden');
            
            // Scroll to bottom
            responseArea.scrollTop = responseArea.scrollHeight;
        }

        function playAudio(audioId) {
            const audio = document.getElementById(audioId);
            const icon = document.querySelector(`.play-icon-${audioId}`);
            const text = document.querySelector(`.play-text-${audioId}`);
            
            if (audio.paused) {
                audio.play();
                text.textContent = 'Pause';
                icon.innerHTML = '<line x1="6" y1="4" x2="6" y2="20"></line><line x1="18" y1="4" x2="18" y2="20"></line>';
            } else {
                audio.pause();
                text.textContent = 'Play Audio';
                icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
            }
            
            audio.addEventListener('ended', () => {
                text.textContent = 'Play Audio';
                icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
            });
        }

        function showError(message) {
            const errorArea = document.getElementById('errorArea');
            errorArea.textContent = message;
            errorArea.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorArea').classList.add('hidden');
        }

        // Initialize on page load
        initSession();
    </script>
</body>
</html>
